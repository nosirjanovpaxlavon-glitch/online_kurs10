        .hero-section p { font-size: 1.5rem; margin-bottom: 2rem; opacity: 0.9; }
        .btn { padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; cursor: pointer; font-size: 1rem; font-weight: 600; transition: all 0.3s ease; }
        .btn-primary { background: white; color: #6366f1; box-shadow: 0 4px 6px rgba(99,102,241,0.3); }
        .btn-primary:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 6px 12px rgba(99,102,241,0.4); }
        .btn-primary:active { transform: translateY(0) scale(0.98); }
        .btn-outline { background: transparent; border: 2px solid white; color: white; }
        .btn-outline:hover { background: white; color: #6366f1; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; padding-bottom: 100px; perspective: 1000px; }
        .section-title { text-align: center; margin-bottom: 2rem; font-size: 2.25rem; font-weight: 800; color: #1f2937; }
        .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 2rem; }
        .course-card { background: white; border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94); transform-style: preserve-3d; cursor: pointer; }
        .course-card:hover { transform: translateY(-12px) rotateX(5deg); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .course-card .course-header { height: 160px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; transform: translateZ(30px); }
        .course-card .course-content { padding: 1.5rem; }
        .course-card .course-subject { display: inline-block; padding: 0.375rem 1rem; border-radius: 1.5rem; font-size: 0.75rem; margin-bottom: 0.75rem; color: white; font-weight: 600; transform: translateZ(20px); }
        .course-card .course-title { font-size: 1.375rem; font-weight: 800; margin-bottom: 0.75rem; color: #1f2937; transform: translateZ(20px); }
        .course-card .course-price { font-size: 1.375rem; font-weight: 800; color: #10b981; margin-bottom: 1rem; transform: translateZ(20px); }
        .course-card .course-desc { color: #6b7280; line-height: 1.6; margin-bottom: 1.25rem; font-size: 0.9rem; transform: translateZ(20px); }
        .course-card .course-info { display: flex; gap: 1rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; transform: translateZ(20px); }
        .course-card .btn { transform: translateZ(25px); }
        .course-card .btn:hover { transform: translateY(-2px) scale(1.05) translateZ(25px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 100; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 2.5rem; border-radius: 1rem; width: 100%; max-width: 500px; animation: modalIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform: scale(0.8); }
        @keyframes modalIn { 0% { transform: scale(0.5) translateY(50px); opacity: 0; } 70% { transform: scale(1.05) translateY(-10px); } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem; }
        .modal-header h2 { font-size: 1.5rem; font-weight: 800; color: #1f2937; }
        .close-btn { background: none; border: none; font-size: 1.75rem; cursor: pointer; color: #9ca3af; }
        .close-btn:hover { color: #1f2937; transform: scale(1.2); }
        .hidden { display: none !important; }
        #errorPopup { position: fixed; top: 20px; right: 20px; background: #ef4444; color: white; padding: 1rem 1.5rem; border-radius: 0.5rem; z-index: 200; display: none; animation: slideIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #errorPopup.show { display: block; }
        @keyframes slideIn { 0% { transform: translateX(150%); opacity: 0; } 60% { transform: translateX(-10px); } 100% { transform: translateX(0); opacity: 1; } }
        .login-type-toggle { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .login-type-toggle label { flex: 1; text-align: center; cursor: pointer; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; transition: all 0.3s; font-weight: 600; }
        .login-type-toggle input[type="radio"] { display: none; }
        .login-type-toggle input[type="radio"]:checked + label { border-color: #6366f1; background: rgba(99,102,241,0.1); color: #6366f1; transform: scale(1.05); }
        .auth-container { display: flex; justify-content: center; align-items: center; min-height: 70vh; }
        .auth-box { background: white; padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #1f2937; }
        .form-group input { width: 100%; padding: 0.875rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; font-size: 1rem; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: #6366f1; transform: scale(1.02); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
        .w-full { width: 100%; }
        .text-center { text-align: center; }
        .text-decoration-none { text-decoration: none !important; }
        .footer { background: linear-gradient(135deg, #1f2937, #111827); color: white; padding: 2rem 2rem; position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; transition: all 0.4s; }
        .footer.open { height: auto; padding: 2rem; }
        .footer.collapsed { height: 60px; overflow: hidden; padding: 1rem 2rem; }
        .footer-toggle { display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .footer-toggle .arrow { font-size: 1.5rem; transition: transform 0.4s; }
        .footer.open .footer-toggle .arrow { transform: rotate(180deg); }
        .footer-content { max-width: 1200px; margin: 0 auto; display: flex; justify-content: center; gap: 3rem; align-items: center; flex-wrap: wrap; }
        .social-link { color: white; text-decoration: none; font-size: 1.25rem; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 0.5rem; transition: all 0.4s; display: inline-block; }
        .social-link:hover { transform: translateY(-8px); }
        .social-link.youtube { background: #ff0000; }
        .social-link.telegram { background: #0088cc; }
        .dark-mode { background: #0f172a; background-image: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2574&auto=format&fit=crop'); background-size: cover; background-position: center; background-attachment: fixed; opacity: 0.95; }
        .dark-mode .course-card { background: #374151; }
        .dark-mode .course-title { color: #f3f4f6; }
        .dark-mode .course-price { color: #10b981; }
        .dark-mode .course-desc { color: #d1d5db; }
        .dark-mode .section-title { color: #f3f4f6; }
        .dark-mode .footer { background: #111827; }
        .dark-mode .login-type-toggle label { border-color: #374151; }
        .dark-mode .login-type-toggle input[type="radio"]:checked + label { background: rgba(99,102,241,0.2); }
    </style>

                <button type="submit" class="btn btn-primary w-full">✅ To'lovni tasdiqlash</button>

                { id: 27, subject: 'Illustrator', icon: '🖌️', gradient: 'linear-gradient(135deg, #ee9ca7, #dfe7fd)', desc: 'Qanday sharoitda o\'tiladi: Vector graphics. Darslar qanday o\'tkaziladi: Paths. 1-mavzu nima: Shapes.', price: 450000, varoqs: 10, videoId: 'dQw4w9WgXcQ', discount: 20000 },
                { id: 28, subject: 'Figma', icon: '✏️', gradient: 'linear-gradient(135deg, #f56565, #ed8936)', desc: 'Qanday sharoitda o\'tiladi: UI design. Darslar qanday o\'tkaziladi: Prototyping. 1-mavzu nima: Components.', price: 500000, varoqs: 10, videoId: 'dQw4w9WgXcQ', discount: 25000 },
                { id: 29, subject: 'UI/UX', icon: '📱', gradient: 'linear-gradient(135deg, #84fab0, #8fd3f4)', desc: 'Qanday sharoitda o\'tiladi: User experience. Darslar qanday o\'tkaziladi: Research. 1-mavzu nima: Wireframes.', price: 550000, varoqs: 10, videoId: 'dQw4w9WgXcQ', discount: 25000 },
                { id: 30, subject: 'Mobile', icon: '📱', gradient: 'linear-gradient(135deg, #4facfe, #00f2fe)', desc: 'Qanday sharoitda o\'tiladi: Mobile apps. Darslar qanday o\'tkaziladi: Platforms. 1-mavzu nima: Navigation.', price: 500000, varoqs: 10, videoId: 'dQw4w9WgXcQ', discount: 25000 },
                { id: 31, subject: 'Flutter', icon: '📱', gradient: 'linear-gradient(135deg, #02569b, #096dc9)', desc: 'Qanday sharoitda o\'tiladi: Cross-platform. Darslar qanday o\'tkaziladi: Widgets. 1-mavzu nima: State management.', price: 550000, varoqs: 10, videoId: 'dQw4w9WgXcQ', discount: 25000 },
                { id: 32, subject: 'React Native', icon: '📱', gradient: 'linear-gradient(135deg, #20232a, #61dafb)', desc: 'Qanday sharoitda o\'tiladi: Native apps. Darslar qanday o\'tkaziladi: Components. 1-mavzu nima: Navigation.', price: 550000, varoqs: 10, videoId: 'dQw4w9WgXcQ', discount: 25000 }
            ],
            bookings: []
        };
        let currentUser = null;
        let currentLoginType = 'student';
        let landingStep = 1;
        const landingSteps = [
            { title: 'Hush kelibsz! 🎉', text: 'Online kurslarimizga xush kelibsiz. Biz bilan dasturlash, IT va boshqa fanlarni o\'rganishingiz mumkin.' },
            { title: 'Biz kim? 👋', text: 'Biz - Paxlavon and Azizbek jamoasi. Sizga eng yaxshi bilimlarni o\'rgatish uchun mashg\'ul bo\'lamiz.' },
            { title: 'Kurslarimiz 📚', text: 'Bizda turli fanlar kurslari mavjud: JavaScript, Python, Java, C++, HTML&CSS va boshqalar.' },
            { title: 'Boshlash! 🚀', text: 'Hozir tizimga kirishingiz yoki ro\'yxatdan o\'tishingiz mumkin. Kurslarni band qilishni unutmang!' }
        ];

        function formatPrice(price) { return price.toLocaleString('uz-UZ') + ' so\'m'; }
        function showError(msg) { const p = document.getElementById('errorPopup'); p.textContent = msg; p.classList.add('show'); setTimeout(() => p.classList.remove('show'), 3000); }
        function showModal(title, msg) { document.getElementById('successModalBody').innerHTML = '<div style="font-size: 4rem; margin-bottom: 1rem;">✅</div><h3 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem;">' + title + '</h3><p style="color: #6b7280;">' + msg + '</p>'; document.getElementById('successModal').classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }
        function closeBooking() { document.getElementById('bookingModal').classList.remove('show'); }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
        function toggleFooter() {
            const footer = document.getElementById('footer');
            if (footer.classList.contains('collapsed')) { footer.classList.remove('collapsed'); footer.classList.add('open'); }
            else { footer.classList.remove('open'); footer.classList.add('collapsed'); }
        }

        function init() {
            localStorage.setItem('onlineKursDB', JSON.stringify(db));
            renderCourses();
        }

        // Show landing modal on first visit
        if (!localStorage.getItem('landingModalShown')) {
            showLandingModal();
        }

        function scrollToCourses() {
            const coursesSection = document.getElementById('coursesSection');
            if (coursesSection) {
                coursesSection.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function showLandingModal() {
            landingStep = 1;
            updateLandingContent();
            document.getElementById('landingModal').classList.add('show');
        }

        function closeLandingModal() {
            document.getElementById('landingModal').classList.remove('show');
            localStorage.setItem('landingModalShown', 'true');
            renderCourses();
        }

        function updateLandingContent() {
            const step = landingSteps[landingStep - 1];
            document.getElementById('landingTitle').textContent = step.title;
            document.getElementById('landingText').textContent = step.text;
            document.getElementById('landingIndicator').textContent = landingStep + '/4';
            
            // Update buttons
            const prevBtn = document.getElementById('landingPrevBtn');
            const nextBtn = document.getElementById('landingNextBtn');
            
            if (landingStep === 1) {
                prevBtn.style.opacity = '0.5';
                prevBtn.style.cursor = 'not-allowed';
            } else {
                prevBtn.style.opacity = '1';
                prevBtn.style.cursor = 'pointer';
            }
            
            if (landingStep === 4) {
                nextBtn.textContent = 'Boshlash! 🚀';
            } else {
                nextBtn.textContent = 'Keyingi ✨';
            }
        }

        function nextLandingStep() {
            if (landingStep < 4) {
                landingStep++;
                updateLandingContent();
            } else {
                closeLandingModal();
            }
        }

        function prevLandingStep() {
            if (landingStep > 1) {
                landingStep--;
                updateLandingContent();
            }
        }

        function renderCourses() {
            const courses = db.courses.slice(0, 10);
            let html = '<div id="heroSection" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 5rem 2rem; text-align: center;"><h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; text-shadow: 0 4px 6px rgba(0,0,0,0.2);">Bizning onlayn kurs saytimmizga hush kelibsz! 🎉</h1><p style="font-size: 1.25rem; margin-bottom: 2rem; opacity: 0.9;">Dasturlash, IT va boshqa fanlarni o\'rganishingiz mumkin.</p><div style="margin-bottom: 2rem;"><button onclick="scrollToCourses()" class="btn btn-primary" style="padding: 1rem 2rem; font-size: 1.25rem;">Kurslarni ko\'rish 👇</button></div></div>';
            html += '<div id="coursesSection" class="section-title" style="text-align: center; margin-bottom: 2rem; font-size: 2.25rem; font-weight: 800; color: #1f2937; font-style: italic;">💡 "Ilm - nur, jaholat - andijon"</div>';
            html += '<div class="course-grid">';
            courses.forEach(c => {
                html += '<div class="course-card" data-subject="' + c.subject + '" onclick="showCourseDetails(' + c.id + ')"><div class="course-header" style="background: ' + c.gradient + ';">' + c.icon + '</div><div class="course-content">';
                html += '<span class="course-subject" style="background: ' + c.gradient + ';">' + c.subject + '</span>';
                html += '<div class="course-title">' + c.subject + ' kursi</div>';
                html += '<div class="course-price">' + formatPrice(c.price) + '</div>';
                html += '<p class="course-desc">' + c.desc.substring(0, 100) + '...</p>';
                html += '<div class="course-info"><span>📅 ' + c.varoqs + ' varoq</span><button class="btn btn-outline" style="font-size: 0.9rem;" onclick="openVideoModal(' + c.id + ', \'' + c.subject + '\')">▶️ 1-darsni ko\'rish</button><button class="btn btn-primary" style="margin-left: 5px;" onclick="openBooking(event, ' + c.id + ')">Band qilish 📝</button></div></div></div>';
            });
            html += '</div>';
            document.getElementById('mainContent').innerHTML = html;
        }

        function showLogin() {
            let html = '<div class="auth-container"><div class="auth-box"><h2 style="text-align: center; margin-bottom: 1.5rem;">🔑 Kirish</h2>';
            html += '<form id="loginForm"><div class="form-group"><label>Foydalanuvchi nomi:</label><input type="text" id="loginUsername" required></div><div class="form-group"><label>Parol:</label><input type="password" id="loginPassword" required></div>';
            html += '<button type="submit" class="btn btn-primary w-full">Kirish ✅</button></form><p style="text-align: center; margin-top: 1rem;">Hisobingiz yo\'qmi? <a href="#" onclick="showRegister(); return false;" style="color: #6366f1; font-weight: 600;">Ro\'yxatdan o\'ting</a></p></div></div>';
            document.getElementById('mainContent').innerHTML = html;
            document.getElementById('loginForm').addEventListener('submit', function(e) { e.preventDefault(); doLogin(); });
        }

        function showRegister() {
            let html = '<div class="auth-container"><div class="auth-box"><h2 style="text-align: center; margin-bottom: 1.5rem;">📝 Ro\'yxatdan o\'tish</h2>';
            html += '<form id="registerForm"><div class="form-group"><label>Ism:</label><input type="text" id="regName" required></div><div class="form-group"><label>Familiya:</label><input type="text" id="regSurname" required></div><div class="form-group"><label>Telefon raqami:</label><input type="tel" id="regPhone" required pattern="^\\+9989[0-9]{8}$" maxlength="13"></div><div class="form-group"><label>Foydalanuvchi nomi:</label><input type="text" id="regUsername" required></div><div class="form-group"><label>Parol:</label><input type="password" id="regPassword" required></div><div class="form-group"><label>Parol (tasdiqlash):</label><input type="password" id="regPasswordConfirm" required></div><button type="submit" class="btn btn-primary w-full">Ro\'yxatdan o\'tish ✅</button></form><p style="text-align: center; margin-top: 1rem;">Hisobingiz bormi? <a href="#" onclick="showLogin(); return false;" style="color: #6366f1; font-weight: 600;">Kirish</a></p></div></div>';
            document.getElementById('mainContent').innerHTML = html;
            document.getElementById('registerForm').addEventListener('submit', function(e) { e.preventDefault(); doRegister(); });
        }

        function doLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            if (!username || !password) { showError('Barcha maydonlarni to\'ldiring'); return; }
            const user = db.users.find(u => u.username === username && u.password === password);
            if (user) {
                currentUser = user;
                updateUI();
                showModal('Muvaffaqiyatli!', 'Siz muvaffaqiyatli tizimga kirdingiz.');
                renderCourses();
            } else { showError('Noto\'g\'ri foydalanuvchi nomi yoki parol'); }
        }

        function doRegister() {
            const name = document.getElementById('regName').value;
            const surname = document.getElementById('regSurname').value;
            const phone = document.getElementById('regPhone').value;
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regPasswordConfirm').value;
            if (password !== confirmPassword) { showError('Parollar mos kelmaydi'); return; }
            if (password.length < 6) { showError('Parol kamida 6 ta belgidan iborat bo\'lishi kerak'); return; }
            if (db.users.find(u => u.username === username)) { showError('Bu foydalanuvchi nomi allaqachon mavjud'); return; }
            db.users.push({ id: db.users.length + 1, name, surname, phone, username, password, role: 'student' });
            localStorage.setItem('onlineKursDB', JSON.stringify(db));
            showModal('Muvaffaqiyatli!', 'Ro\'yxatdan o\'tish muvaffaqiyatli!');
            showLogin();
        }

        function updateUI() {
            document.getElementById('authButtons').classList.add('hidden');
            document.getElementById('userMenu').classList.remove('hidden');
            document.getElementById('userEmail').textContent = currentUser.name || currentUser.username;
        }

        function logout() { currentUser = null; updateUI(); renderCourses(); }

        function showCourseDetails(courseId) {
            const course = db.courses.find(c => c.id === courseId);
            if (!course) return;
            
            // O'chirish - tafsilotlar ochiladi
            const html = `
                <div style="text-align: center;">
                    <div style="font-size: 4rem; margin-bottom: 1rem;">${course.icon}</div>
                    <h3 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 1rem;">${course.subject}</h3>
                    <p style="font-size: 1.1rem; color: #6b7280; line-height: 1.6;">${course.desc}</p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.5rem 0;">
                        <div style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem;">
                            <div style="font-weight: 600;">📅 Varoqlar</div>
                            <div style="font-size: 1.5rem; font-weight: 800; color: #6366f1;">${course.varoqs}</div>
                        </div>
                        <div style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem;">
                            <div style="font-weight: 600;">💰 Narx</div>
                            <div style="font-size: 1.5rem; font-weight: 800; color: #10b981;">${formatPrice(course.price)}</div>
                        </div>
                        <div style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem;">
                            <div style="font-weight: 600;">🎓 Discount</div>
                            <div style="font-size: 1.5rem; font-weight: 800; color: #f59e0b;">${formatPrice(course.discount)}</div>
                        </div>
                        <div style="background: #f3f4f6; padding: 1rem; border-radius: 0.5rem;">
                            <div style="font-weight: 600;">▶️ Video</div>
                            <div><button class="btn btn-primary" onclick="openVideoModal(${course.id}, '${course.subject}')">1-darsni ko'rish</button></div>
                        </div>
                    </div>
                    <p style="font-size: 0.9rem; color: #9ca3af;">Discount kod "Stanford" - ${course.discount.toLocaleString()} so'm chegirma</p>
                </div>
            `;
            document.getElementById('courseDetailsTitle').textContent = '📚 ' + course.subject + ' kursi haqida';
            document.getElementById('courseDetailsBody').innerHTML = html;
            document.getElementById('courseDetailsModal').classList.add('show');
        }

        function openYouTubeChannel(e) {
            e.stopPropagation();
            window.open('https://www.youtube.com/@NOSIRJANOVPAXLAVON', '_blank');
        }

        function openBooking(e, courseId) {
            e.stopPropagation();
            if (!currentUser) { showError('Avval tizimga kiring'); showLogin(); return; }
            const course = db.courses.find(c => c.id === courseId);
            if (!course) return;
            document.getElementById('bookingCourseId').value = courseId;
            document.getElementById('bookingName').value = '';
            document.getElementById('bookingPhone').value = '';
            document.getElementById('bookingPassword').value = '';
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('bookingDate').valueAsDate = tomorrow;
            document.getElementById('bookingModal').classList.add('show');
        }

        function openVideoModal(courseId, courseName) {
            const course = db.courses.find(c => c.id === courseId);
            if (course && course.videoId) {
                const embedUrl = 'https://www.youtube.com/embed/' + course.videoId;
                document.getElementById('videoModalTitle').textContent = '▶️ ' + courseName + ' - 1-dars';
                document.getElementById('videoPlayer').src = embedUrl;
                document.getElementById('videoModal').classList.add('show');
                document.getElementById('courseDetailsModal').classList.remove('show');
            }
        }

        function submitBooking(e) {
            e.preventDefault();
            const courseId = parseInt(document.getElementById('bookingCourseId').value);
            const name = document.getElementById('bookingName').value;
            const phone = document.getElementById('bookingPhone').value;
            const date = document.getElementById('bookingDate').value;
            const duration = parseInt(document.getElementById('bookingDuration').value);
            const discountCode = document.getElementById('bookingDiscount').value.trim();
            const password = document.getElementById('bookingPassword').value;
            if (password !== 'oylik') { showError('Noto\'g\'ri parol'); return; }
            
            const course = db.courses.find(c => c.id === courseId);
            let finalPrice = course.price;
            let discountApplied = 0;
            
            if (discountCode === 'Stanford') {
                discountApplied = course.discount;
                finalPrice = course.price - course.discount;
            }
            
            const booking = { id: db.bookings.length + 1, courseId: courseId, teacherId: currentUser.id, name: name, phone: phone, date: date, duration: duration, discount: discountApplied, finalPrice: finalPrice };
            db.bookings.push(booking);
            localStorage.setItem('onlineKursDB', JSON.stringify(db));
            closeBooking();
            
            let msg = 'Kurs muvaffaqiyatli band qilindi! ✅\n';
            msg += 'Jami to\'lov: ' + finalPrice.toLocaleString() + ' so\'m';
            
            if (discountApplied > 0) {
                msg += '\nDiscount kod: ' + discountApplied.toLocaleString() + ' so\'m';
            }
            
            showModal('Muvaffaqiyatli!', msg);
            renderCourses();
        }

        document.getElementById('bookingForm').addEventListener('submit', submitBooking);
        init();
    </script>
</body>
</html>
